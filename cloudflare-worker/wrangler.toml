name = "congress-stock-tracker-alerts"
main = "src/index.js"
compatibility_date = "2024-11-01"

kv_namespaces = [
  { binding = "SUBS_KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

# Secrets (set with `wrangler secret put <NAME>`, not stored here):
#   SENDGRID_API_KEY       - SendGrid API key
#   FROM_EMAIL              - the single sender address you verified in SendGrid
#   SUBSCRIPTIONS_API_KEY   - any long random string; also set as a GitHub
#                             Actions secret so send_alerts.py can read
#                             /alert-recipients
