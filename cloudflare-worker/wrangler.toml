name = "congress-stock-tracker-alerts"
main = "src/index.js"
compatibility_date = "2024-11-01"

kv_namespaces = [
  { binding = "SUBS_KV", id = "86b16f1ec37c425099bc195af4a76b8b" }
]

# Secrets (set with `wrangler secret put <NAME>`, not stored here):
#   BREVO_API_KEY           - Brevo API key
#   FROM_EMAIL              - the single sender address you verified in Brevo
#   SUBSCRIPTIONS_API_KEY   - any long random string; also set as a GitHub
#                             Actions secret so send_alerts.py can read
#                             /alert-recipients
