name: Fetch Congress Trades

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-trades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch trades
        run: |
          python fetch_trades.py

      - name: Send trade alerts
        env:
          ALERTS_WORKER_URL: ${{ secrets.ALERTS_WORKER_URL }}
          SUBSCRIPTIONS_API_KEY: ${{ secrets.SUBSCRIPTIONS_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          python send_alerts.py

      - name: Commit updated trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/trades.json

          git diff --cached --quiet || git commit -m "Update congressional trades"

          git push
